<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票详情 - 基金分析工具</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #ffffff;
            --bg-hover: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --accent-amber: #d97706;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

        /* 顶部导航 */
        .header {
            display: flex; align-items: center; margin-bottom: 24px;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn {
            padding: 10px 20px; background: rgba(255,255,255,0.1); color: white;
            border: 1px solid rgba(255,255,255,0.2); border-radius: var(--radius-md);
            cursor: pointer; font-size: 1em; margin-right: 20px; transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        .header h1 {
            font-size: 1.5em; font-weight: 600;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 卡片通用样式 */
        .card {
            background: var(--bg-card); border-radius: var(--radius-lg);
            padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .card h2 {
            color: var(--text-primary); margin-bottom: 16px; padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color); font-size: 1.1em; font-weight: 600;
        }

        /* 实时行情头部 */
        .stock-header {
            background: var(--bg-card); border-radius: var(--radius-lg);
            padding: 28px; margin-bottom: 20px; box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .stock-main-info {
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 20px;
        }
        .stock-name {
            font-size: 1.8em; font-weight: 700; color: var(--text-primary);
            margin-bottom: 6px; letter-spacing: -0.5px;
        }
        .stock-code { font-size: 1em; color: var(--text-secondary); font-family: monospace; }
        .stock-market {
            display: inline-block; padding: 3px 10px; background: #eff6ff; color: var(--accent-blue);
            border-radius: 20px; font-size: 0.82em; margin-left: 8px; font-weight: 600; border: 1px solid #bfdbfe;
        }
        .stock-industry {
            display: inline-block; padding: 3px 10px; background: #fef3c7; color: #92400e;
            border-radius: 20px; font-size: 0.82em; margin-left: 8px; font-weight: 600; border: 1px solid #fbbf24;
        }
        .stock-price-info { text-align: right; }
        .stock-price {
            font-size: 2.4em; font-weight: 700; color: var(--text-primary); font-family: monospace;
        }
        .stock-change { font-size: 1.1em; margin-top: 4px; font-weight: 600; }
        .stock-change.positive { color: var(--accent-red); }
        .stock-change.negative { color: var(--accent-green); }

        /* 行情明细网格 */
        .price-details {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-color);
        }
        .price-item {
            padding: 12px; background: #f8fafc; border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }
        .price-item label {
            display: block; color: var(--text-secondary); font-size: 0.78em;
            margin-bottom: 4px; font-weight: 500;
        }
        .price-item .value {
            font-size: 1.1em; font-weight: 700; color: var(--text-primary); font-family: monospace;
        }

        /* K线图区域 */
        .kline-container { margin-bottom: 20px; }
        .kline-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .kline-tabs { display: flex; gap: 8px; }
        .kline-tab {
            padding: 6px 14px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
            color: white; cursor: pointer; transition: all 0.3s; font-size: 0.9em;
        }
        .kline-tab:hover { background: rgba(255,255,255,0.2); }
        .kline-tab.active { background: rgba(255,255,255,0.9); color: #333; }

        /* 两列布局 */
        .grid-2col {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px;
        }

        /* 新闻列表 */
        .news-list { list-style: none; }
        .news-item {
            padding: 14px; border-bottom: 1px solid var(--border-color);
            cursor: pointer; transition: all 0.2s; border-radius: var(--radius-sm);
        }
        .news-item:hover { background: #f8fafc; padding-left: 18px; }
        .news-item:last-child { border-bottom: none; }
        .news-title { font-size: 0.95em; color: var(--text-primary); margin-bottom: 6px; line-height: 1.5; font-weight: 500; }
        .news-meta {
            display: flex; gap: 12px; font-size: 0.78em; color: var(--text-secondary); align-items: center;
        }
        .news-type {
            padding: 2px 8px; background: #eff6ff; color: var(--accent-blue);
            border-radius: 20px; font-size: 0.78em; font-weight: 600; border: 1px solid #bfdbfe;
        }
        .news-type.type-公告 { background: #fef3c7; color: #92400e; border-color: #fbbf24; }

        /* 行业龙头股 - 分A股/港股 */
        .leaders-section { margin-bottom: 12px; }
        .leaders-section-title {
            font-size: 0.95em; font-weight: 600; color: var(--text-primary);
            margin-bottom: 10px; padding-left: 10px;
            border-left: 3px solid var(--accent-blue);
        }
        .leaders-section-title.hk { border-left-color: var(--accent-amber); }
        .industry-stocks {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px;
        }
        .industry-stock-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 14px; background: #f8fafc; border-radius: var(--radius-md);
            cursor: pointer; transition: all 0.2s; border: 1px solid var(--border-color);
        }
        .industry-stock-item:hover { background: #fff; transform: translateX(3px); box-shadow: var(--shadow-md); }
        .stock-info-left { display: flex; flex-direction: column; }
        .stock-name-small { font-weight: 600; color: var(--text-primary); margin-bottom: 3px; font-size: 0.95em; }
        .stock-code-small { font-size: 0.82em; color: var(--text-secondary); font-family: monospace; }
        .stock-right { text-align: right; }
        .stock-price-small { font-weight: 700; color: var(--text-primary); font-size: 1.05em; font-family: monospace; }
        .stock-change-small { font-size: 0.85em; margin-top: 2px; font-weight: 600; }
        .stock-change-small.positive { color: var(--accent-red); }
        .stock-change-small.negative { color: var(--accent-green); }
        .market-tag {
            font-size: 0.7em; padding: 1px 6px; border-radius: 10px; margin-left: 6px;
            font-weight: 600; vertical-align: middle;
        }
        .market-tag.a-stock { background: #eff6ff; color: #1d4ed8; border: 1px solid #93c5fd; }
        .market-tag.hk-stock { background: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }

        /* 财务数据 */
        .financial-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;
        }
        .financial-item {
            padding: 16px; background: #f8fafc; border-radius: var(--radius-md);
            text-align: center; border: 1px solid var(--border-color);
        }
        .financial-item:hover { background: #fff; box-shadow: var(--shadow-sm); }
        .financial-item label {
            display: block; color: var(--text-secondary); font-size: 0.78em;
            margin-bottom: 6px; font-weight: 500;
        }
        .financial-item .value {
            font-size: 1.3em; font-weight: 700; color: var(--text-primary); font-family: monospace;
        }
        .financial-item .unit { font-size: 0.78em; color: var(--text-secondary); margin-left: 3px; }

        /* 公司信息 */
        .company-info { line-height: 1.8; color: var(--text-secondary); }
        .company-info p { margin-bottom: 8px; }
        .company-info strong { color: var(--text-primary); }

        /* 持股分析 */
        .holder-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
        }
        .holder-item {
            padding: 12px; background: #f8fafc; border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent-blue); border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-blue);
        }
        .holder-item label { color: var(--text-secondary); font-size: 0.8em; }
        .holder-item .value {
            color: var(--text-primary); font-weight: 700; font-size: 1em; margin-top: 4px; font-family: monospace;
        }

        /* 加载和错误 */
        .loading { text-align: center; padding: 60px; color: white; }
        .loading::after {
            content: ''; display: inline-block; width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid white;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-left: 15px; vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error {
            background: linear-gradient(135deg, #fef2f2, #fee2e2); color: #991b1b;
            padding: 20px; border-radius: var(--radius-md); text-align: center; border: 1px solid #fecaca;
        }
        .no-data { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 0.95em; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.2em; }
            .card { padding: 16px; }
            .stock-main-info { flex-direction: column; }
            .stock-price-info { text-align: left; }
            .stock-name { font-size: 1.4em; }
            .stock-price { font-size: 1.8em; }
            .grid-2col { grid-template-columns: 1fr; }
            .price-details { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← 返回基金分析</button>
            <h1>📊 股票详情</h1>
        </div>

        <div id="loading" class="loading">正在加载股票数据...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <!-- 实时行情 -->
            <div class="stock-header">
                <div class="stock-main-info">
                    <div>
                        <div class="stock-name" id="stockName">--</div>
                        <div>
                            <span class="stock-code" id="stockCode">--</span>
                            <span class="stock-market" id="stockMarket">--</span>
                            <span class="stock-industry" id="stockIndustry"></span>
                        </div>
                    </div>
                    <div class="stock-price-info">
                        <div class="stock-price" id="stockPrice">--</div>
                        <div class="stock-change" id="stockChange">--</div>
                    </div>
                </div>
                <div class="price-details" id="priceDetails"></div>
            </div>

            <!-- K线图 -->
            <div class="card kline-container">
                <div class="kline-header">
                    <h2>📈 K线图</h2>
                    <div class="kline-tabs">
                        <button class="kline-tab active" data-period="daily" onclick="switchKlinePeriod('daily')">日K</button>
                        <button class="kline-tab" data-period="weekly" onclick="switchKlinePeriod('weekly')">周K</button>
                        <button class="kline-tab" data-period="monthly" onclick="switchKlinePeriod('monthly')">月K</button>
                    </div>
                </div>
                <div id="klineChart" style="width: 100%; height: 420px;"></div>
            </div>

            <div class="grid-2col">
                <!-- 公司说明 -->
                <div class="card">
                    <h2>🏢 公司说明</h2>
                    <div class="company-info" id="companyInfo">
                        <div class="no-data">暂无公司信息</div>
                    </div>
                </div>

                <!-- 持股分析 -->
                <div class="card">
                    <h2>👥 持股分析</h2>
                    <div id="holderAnalysis">
                        <div class="no-data">暂无持股数据</div>
                    </div>
                </div>
            </div>

            <!-- 相关财经新闻 -->
            <div class="card">
                <h2>📰 相关财经新闻</h2>
                <div id="newsSection">
                    <div class="no-data">暂无新闻</div>
                </div>
            </div>

            <!-- 行业龙头股（A股+港股分区） -->
            <div class="card">
                <h2>🏆 行业龙头股</h2>
                <p style="color: var(--text-secondary); margin-bottom: 16px; font-size: 0.9em;">点击股票查看详情</p>
                <div id="industryStocks">
                    <div class="no-data">暂无数据</div>
                </div>
            </div>

            <!-- 财务数据 -->
            <div class="card" id="financialCard" style="display: none;">
                <h2>📊 财务数据</h2>
                <div id="financialSection"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const stockCode = urlParams.get('code');
        const stockNameParam = urlParams.get('name') || '';
        const fundCode = urlParams.get('fund') || '';

        let klineChart = null;
        let currentKlinePeriod = 'daily';
        let klineResizeListenerAdded = false;

        window.onload = function() {
            if (stockCode) {
                loadStockData();
            } else {
                showError('缺少股票代码参数');
            }
        };

        function goBack() {
            if (fundCode) {
                window.location.href = '/';
            } else {
                window.history.back();
            }
        }

        async function loadStockData() {
            try {
                const response = await fetch(`/api/stock/${stockCode}`);
                if (!response.ok) throw new Error(`HTTP错误: ${response.status}`);

                const result = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (result.success) {
                    displayStockData(result.data);
                    document.getElementById('content').style.display = 'block';
                    loadKlineData(currentKlinePeriod);
                } else {
                    showError(result.error || '加载失败');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError('网络错误: ' + error.message);
            }
        }

        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function displayStockData(data) {
            // 股票名称和代码
            document.getElementById('stockName').textContent = data.name || data.company_name || stockNameParam || stockCode;
            document.getElementById('stockCode').textContent = data.code;
            document.getElementById('stockMarket').textContent = data.market || getMarketName(data.code);
            if (data.industry) {
                document.getElementById('stockIndustry').textContent = data.industry;
                document.getElementById('stockIndustry').style.display = 'inline-block';
            }

            // 价格
            const price = Number(data.price) || 0;
            const change = Number(data.change) || 0;
            const changePct = Number(data.change_pct) || 0;
            const sign = change >= 0 ? '+' : '';
            const changeClass = change >= 0 ? 'positive' : 'negative';

            document.getElementById('stockPrice').textContent = price > 0 ? price.toFixed(2) : '--';
            document.getElementById('stockPrice').style.color = change >= 0 ? 'var(--accent-red)' : 'var(--accent-green)';
            document.getElementById('stockChange').textContent = changePct !== 0 ?
                `${sign}${change.toFixed(2)} (${sign}${changePct.toFixed(2)}%)` : '--';
            document.getElementById('stockChange').className = `stock-change ${changeClass}`;

            // 行情明细
            const priceDetails = document.getElementById('priceDetails');
            const details = [
                { label: '昨收', value: fmtPrice(data.prev_close) },
                { label: '今开', value: fmtPrice(data.open) },
                { label: '最高', value: fmtPrice(data.high) },
                { label: '最低', value: fmtPrice(data.low) },
                { label: '成交量', value: fmtVol(data.volume) },
                { label: '成交额', value: fmtAmt(data.amount) },
                { label: '市盈率(PE)', value: data.pe > 0 ? Number(data.pe).toFixed(2) : '--' },
                { label: '市净率(PB)', value: data.pb > 0 ? Number(data.pb).toFixed(2) : '--' },
                { label: '股息率', value: data.dividend_yield > 0 ? Number(data.dividend_yield).toFixed(2) + '%' : '--' },
                { label: '总市值', value: fmtCap(data.market_cap) },
            ];
            priceDetails.innerHTML = details.map(d => `
                <div class="price-item">
                    <label>${d.label}</label>
                    <div class="value">${d.value}</div>
                </div>
            `).join('');

            // 公司说明
            const companyInfo = document.getElementById('companyInfo');
            if (data.company_name || data.industry) {
                companyInfo.innerHTML = `
                    ${data.company_name ? `<p><strong>公司全称：</strong>${escapeHtml(data.company_name)}</p>` : ''}
                    ${data.industry ? `<p><strong>所属行业：</strong>${escapeHtml(data.industry)}</p>` : ''}
                `;
            }

            // 持股分析
            const holderAnalysis = document.getElementById('holderAnalysis');
            if (data.holder_analysis) {
                const ha = data.holder_analysis;
                holderAnalysis.innerHTML = `
                    <div class="holder-grid">
                        <div class="holder-item">
                            <label>股东总数</label>
                            <div class="value">${typeof ha.holder_count === 'number' ? fmtVol(ha.holder_count) : ha.holder_count || '--'}</div>
                        </div>
                        <div class="holder-item">
                            <label>报告期</label>
                            <div class="value">${ha.report_date ? ha.report_date.substring(0,10) : '--'}</div>
                        </div>
                    </div>
                `;
            }

            // 新闻
            const newsSection = document.getElementById('newsSection');
            if (data.news && data.news.length > 0) {
                newsSection.innerHTML = `
                    <ul class="news-list">
                        ${data.news.map(news => `
                            <li class="news-item" ${news.url ? `onclick="window.open('${escapeHtml(news.url)}', '_blank')"` : ''}>
                                <div class="news-title">${escapeHtml(news.title || '')}</div>
                                <div class="news-meta">
                                    <span>${escapeHtml(news.publish_time || '')}</span>
                                    ${news.type ? `<span class="news-type ${news.type === '公告' ? 'type-公告' : ''}">${escapeHtml(news.type)}</span>` : ''}
                                    ${news.source ? `<span>${escapeHtml(news.source)}</span>` : ''}
                                </div>
                            </li>
                        `).join('')}
                    </ul>
                `;
            } else {
                newsSection.innerHTML = '<div class="no-data">暂无相关新闻</div>';
            }

            // 行业龙头股（分A股/港股）
            const industryStocks = document.getElementById('industryStocks');
            if (data.industry_leaders && data.industry_leaders.length > 0) {
                const aStocks = data.industry_leaders.filter(s => s.market !== '港股');
                const hkStocks = data.industry_leaders.filter(s => s.market === '港股');

                let html = '';

                if (aStocks.length > 0) {
                    html += `
                        <div class="leaders-section">
                            <div class="leaders-section-title">A股龙头</div>
                            <div class="industry-stocks">
                                ${aStocks.map(stock => renderStockItem(stock, 'a-stock')).join('')}
                            </div>
                        </div>
                    `;
                }

                if (hkStocks.length > 0) {
                    html += `
                        <div class="leaders-section" style="margin-top: 16px;">
                            <div class="leaders-section-title hk">港股龙头</div>
                            <div class="industry-stocks">
                                ${hkStocks.map(stock => renderStockItem(stock, 'hk-stock')).join('')}
                            </div>
                        </div>
                    `;
                }

                industryStocks.innerHTML = html;
            } else {
                industryStocks.innerHTML = '<div class="no-data">暂无数据</div>';
            }

            // 财务数据
            if (data.financial) {
                const f = data.financial;
                const financialCard = document.getElementById('financialCard');
                financialCard.style.display = 'block';
                document.getElementById('financialSection').innerHTML = `
                    <div class="financial-grid">
                        <div class="financial-item">
                            <label>报告期</label>
                            <div class="value">${f.report_date ? f.report_date.substring(0,10) : '--'}</div>
                        </div>
                        <div class="financial-item">
                            <label>每股收益</label>
                            <div class="value">${fmtNum(f.eps)}</div>
                        </div>
                        <div class="financial-item">
                            <label>营业收入</label>
                            <div class="value">${fmtAmt(f.revenue)}</div>
                        </div>
                        <div class="financial-item">
                            <label>净利润</label>
                            <div class="value">${fmtAmt(f.net_profit)}</div>
                        </div>
                        <div class="financial-item">
                            <label>ROE</label>
                            <div class="value">${fmtPct(f.roe)}</div>
                        </div>
                        <div class="financial-item">
                            <label>资产负债率</label>
                            <div class="value">${fmtPct(f.debt_ratio)}</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderStockItem(stock, tagClass) {
            const changePct = stock.change_pct || 0;
            const changeClass = changePct >= 0 ? 'positive' : 'negative';
            const sign = changePct >= 0 ? '+' : '';
            const safeName = escapeHtml(stock.name || '');
            const safeCode = escapeHtml(stock.code || '');
            return `
                <div class="industry-stock-item" onclick="viewStock('${safeCode}', '${safeName}')">
                    <div class="stock-info-left">
                        <div class="stock-name-small">${safeName}</div>
                        <div class="stock-code-small">${safeCode}</div>
                    </div>
                    <div class="stock-right">
                        <div class="stock-price-small">${stock.price > 0 ? stock.price.toFixed(2) : '--'}</div>
                        <div class="stock-change-small ${changeClass}">${changePct !== 0 ? `${sign}${changePct.toFixed(2)}%` : '--'}</div>
                    </div>
                </div>
            `;
        }

        function viewStock(code, name) {
            window.location.href = `/stock?code=${code}&name=${encodeURIComponent(name)}&fund=${fundCode}`;
        }

        function getMarketName(code) {
            if (code.length === 5) return '港股';
            if (code.startsWith('6')) return '上证A股';
            if (code.startsWith('0') || code.startsWith('3')) return '深证A股';
            if (code.startsWith('8') || code.startsWith('4') || code.startsWith('9')) return '北交所';
            return '未知';
        }

        function fmtPrice(n) { const v = Number(n); return (v && !isNaN(v) && v !== 0) ? v.toFixed(2) : '--'; }
        function fmtNum(n) { const v = Number(n); return (v && !isNaN(v) && v !== 0) ? v.toFixed(2) : '--'; }
        function fmtPct(n) { const v = Number(n); return (v && !isNaN(v) && v !== 0) ? v.toFixed(2) + '%' : '--'; }
        function fmtVol(n) {
            const v = Number(n); if (!v || isNaN(v)) return '--';
            if (v >= 100000000) return (v / 100000000).toFixed(2) + '亿';
            if (v >= 10000) return (v / 10000).toFixed(2) + '万';
            return v.toFixed(0);
        }
        function fmtAmt(n) {
            const v = Number(n); if (!v || isNaN(v)) return '--';
            if (v >= 100000000) return (v / 100000000).toFixed(2) + '亿';
            if (v >= 10000) return (v / 10000).toFixed(2) + '万';
            return v.toFixed(2);
        }
        function fmtCap(n) {
            const v = Number(n); if (!v || isNaN(v)) return '--';
            if (v >= 1000000000000) return (v / 1000000000000).toFixed(2) + '万亿';
            if (v >= 100000000) return (v / 100000000).toFixed(2) + '亿';
            return (v / 100000000).toFixed(2) + '亿';
        }
        function fmtVolume(vol) {
            if (!vol) return '--';
            if (vol >= 100000000) return (vol / 100000000).toFixed(2) + '亿';
            if (vol >= 10000) return (vol / 10000).toFixed(2) + '万';
            return vol.toFixed(0);
        }

        // ========== K线图 ==========
        async function loadKlineData(period) {
            const chartDom = document.getElementById('klineChart');
            chartDom.innerHTML = '<div style="text-align:center;padding:50px;color:#94a3b8;">加载中...</div>';
            try {
                const response = await fetch(`/api/stock/${stockCode}/kline?period=${period}&limit=120`);
                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    renderKlineChart(result.data);
                } else {
                    chartDom.innerHTML = '<div style="text-align:center;padding:50px;color:#94a3b8;">暂无K线数据</div>';
                }
            } catch (error) {
                console.error('加载K线数据失败:', error);
                chartDom.innerHTML = '<div style="text-align:center;padding:50px;color:#94a3b8;">K线数据加载失败</div>';
            }
        }

        function switchKlinePeriod(period) {
            currentKlinePeriod = period;
            document.querySelectorAll('.kline-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.period === period) tab.classList.add('active');
            });
            loadKlineData(period);
        }

        function renderKlineChart(data) {
            const chartDom = document.getElementById('klineChart');
            if (!klineChart) klineChart = echarts.init(chartDom);

            const dates = data.map(item => item.date);
            const ohlc = data.map(item => [item.open, item.close, item.low, item.high]);
            const volumes = data.map(item => item.volume);

            const colorUp = '#ef5350';
            const colorDown = '#26a69a';

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    formatter: function(params) {
                        const d = params[0];
                        const k = ohlc[d.dataIndex];
                        const vol = volumes[d.dataIndex];
                        const chg = k[1] - k[0];
                        const chgPct = k[0] ? ((chg / k[0]) * 100).toFixed(2) : 0;
                        const color = chg > 0 ? colorUp : (chg < 0 ? colorDown : '#999');
                        return `<div style="font-family:monospace;">
                            <div style="font-weight:bold;margin-bottom:4px">${d.axisValue}</div>
                            <div>开盘: <span style="color:${color}">${k[0]}</span></div>
                            <div>收盘: <span style="color:${color}">${k[1]}</span></div>
                            <div>最低: ${k[2]}</div>
                            <div>最高: ${k[3]}</div>
                            <div>涨跌: <span style="color:${color}">${chg > 0 ? '+' : ''}${chg.toFixed(2)} (${chg > 0 ? '+' : ''}${chgPct}%)</span></div>
                            <div>成交量: ${fmtVolume(vol)}</div>
                        </div>`;
                    }
                },
                grid: [
                    { left: '10%', right: '8%', top: '8%', height: '55%' },
                    { left: '10%', right: '8%', top: '72%', height: '15%' }
                ],
                xAxis: [
                    { type: 'category', data: dates, gridIndex: 0, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#e2e8f0' } } },
                    { type: 'category', data: dates, gridIndex: 1, axisLabel: { color: '#64748b', fontSize: 10, formatter: v => v.substring(5) }, axisLine: { lineStyle: { color: '#e2e8f0' } } }
                ],
                yAxis: [
                    { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } }, axisLabel: { color: '#64748b' } },
                    { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { color: '#64748b', formatter: v => v >= 100000000 ? (v/100000000).toFixed(0)+'亿' : v >= 10000 ? (v/10000).toFixed(0)+'万' : v } }
                ],
                dataZoom: [
                    { type: 'inside', xAxisIndex: [0, 1], start: 70, end: 100 },
                    { type: 'slider', xAxisIndex: [0, 1], start: 70, end: 100, height: 20, bottom: 10 }
                ],
                series: [
                    { name: 'K线', type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0, itemStyle: { color: colorUp, color0: colorDown, borderColor: colorUp, borderColor0: colorDown } },
                    { name: '成交量', type: 'bar', data: volumes, xAxisIndex: 1, yAxisIndex: 1, itemStyle: { color: function(p) { return ohlc[p.dataIndex][1] >= ohlc[p.dataIndex][0] ? colorUp : colorDown; } } }
                ]
            };

            klineChart.setOption(option, true);
            if (!klineResizeListenerAdded) {
                window.addEventListener('resize', () => klineChart && klineChart.resize());
                klineResizeListenerAdded = true;
            }
        }
    </script>
</body>
</html>
