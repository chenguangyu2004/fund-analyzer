<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金投资仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/stripe-theme.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <nav class="top-nav">
            <div class="nav-brand">
                <i class="fas fa-chart-line"></i>
                <h1>基金投资仪表盘</h1>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"></button>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="dashboard">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <!-- 今日收益概览 -->
                <div class="card hidden" id="dailyReturnCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-chart-pie"></i> 今日收益</span>
                        <button class="btn btn-secondary" onclick="refreshDailyReturn()" style="padding:4px 10px;font-size:11px;">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div class="daily-return-value" id="dailyReturnValue" style="text-align:center;padding:12px 0;font-size:24px;font-weight:300;font-family:var(--font-mono);font-feature-settings:'tnum';letter-spacing:-0.48px;">
                        <span style="color:var(--text-muted);font-size:13px;">计算中...</span>
                    </div>
                    <div id="dailyReturnDetail" style="font-size:12px;color:var(--text-muted);text-align:center;"></div>
                </div>

                <!-- 已保存基金 -->
                <div class="card" id="savedFundsCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-star"></i> 已保存基金</span>
                    </div>
                    <div id="savedFundsList" class="saved-funds-list">
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>暂无保存的基金</p>
                        </div>
                    </div>
                </div>

                <!-- 输入表单 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-search"></i> 分析基金</span>
                    </div>
                    <div class="input-group">
                        <div class="input-field">
                            <label>基金代码（6位数字）</label>
                            <input type="text" id="fund_code" placeholder="例如：000001" maxlength="6">
                        </div>
                        <div class="input-field">
                            <label>持仓成本（元）</label>
                            <input type="number" id="buy_price" placeholder="例如：1.5000" step="0.0001">
                        </div>
                        <div class="input-field">
                            <label>持有份额</label>
                            <input type="number" id="shares" placeholder="例如：10000" step="0.01">
                        </div>
                        <button class="btn btn-primary" onclick="analyzeFund()">
                            <i class="fas fa-search"></i> 分析
                        </button>
                        <button class="btn btn-success" onclick="saveCurrentFund()">
                            <i class="fas fa-save"></i> 保存
                        </button>
                    </div>
                </div>

                <!-- 盈亏概览 -->
                <div class="card hidden" id="profitCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-wallet"></i> 盈亏概览</span>
                    </div>
                    <div class="profit-grid" id="profitGrid"></div>
                    <div class="profit-bar-container" id="profitBarContainer">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                            <span style="font-size: 0.7em; color: var(--text-muted);">亏损</span>
                            <span style="font-size: 0.7em; color: var(--text-muted);">盈利</span>
                        </div>
                        <div class="profit-bar">
                            <div class="profit-bar-fill" id="profitBarFill"></div>
                            <div class="profit-bar-marker" id="profitBarMarker"></div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 主内容 -->
            <main class="main-content">
                <!-- 加载状态 -->
                <div class="card loading hidden" id="loadingCard">
                    <div class="loading-spinner"></div>
                    <p>正在分析基金，请稍候...</p>
                </div>

                <!-- 错误提示 -->
                <div class="error-message hidden" id="errorMessage"></div>

                <!-- 基金信息 -->
                <div class="card hidden" id="fundInfoCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-info-circle"></i> 基金信息</span>
                        <button class="btn btn-secondary" onclick="refreshFund()" style="padding: 6px 12px; font-size: 0.8em;">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                    </div>
                    <div class="fund-info-card" id="fundInfoContent"></div>
                </div>

                <!-- 净值走势图 -->
                <div class="card chart-card hidden" id="chartCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-chart-area"></i> 净值走势</span>
                        <div class="chart-controls">
                            <button class="chart-toggle active" id="toggleFund" onclick="toggleChartLine('fund')">单位净值</button>
                            <button class="chart-toggle" id="toggleBenchmark" onclick="toggleChartLine('benchmark')">沪深300</button>
                            <button class="chart-toggle" id="toggleCost" onclick="toggleChartLine('cost')">成本线</button>
                            <div class="period-selector">
                                <button class="period-btn" data-period="30" onclick="changePeriod(30)">1月</button>
                                <button class="period-btn active" data-period="90" onclick="changePeriod(90)">3月</button>
                                <button class="period-btn" data-period="180" onclick="changePeriod(180)">6月</button>
                                <button class="period-btn" data-period="365" onclick="changePeriod(365)">1年</button>
                            </div>
                        </div>
                    </div>
                    <div class="chart-container" id="chartContainer"></div>
                </div>

                <!-- 关键指标 -->
                <div class="card hidden" id="metricsCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-shield-alt"></i> 风险指标</span>
                    </div>
                    <div class="metrics-grid" id="metricsGrid"></div>
                </div>

                <!-- 持仓分析 -->
                <div class="card hidden" id="holdingsCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-list"></i> 前十大持仓</span>
                    </div>
                    <table class="holdings-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>股票代码</th>
                                <th>股票名称</th>
                                <th>最新价</th>
                                <th>涨跌幅</th>
                                <th>占净值比</th>
                            </tr>
                        </thead>
                        <tbody id="holdingsBody"></tbody>
                    </table>
                </div>

                <!-- AI分析 -->
                <div class="card ai-analysis-card hidden" id="aiAnalysisCard">
                    <div class="card-header">
                        <span class="card-title"><i class="fas fa-robot"></i> AI智能分析</span>
                        <button class="btn btn-primary" onclick="performAIAnalysis()" id="aiAnalyzeBtn" style="padding: 8px 16px;">
                            <i class="fas fa-brain"></i> 开始分析
                        </button>
                    </div>
                    <div id="aiAnalysisContent">
                        <div class="empty-state">
                            <i class="fas fa-brain"></i>
                            <p>点击上方按钮获取AI智能投资建议</p>
                        </div>
                    </div>
                    <!-- 量化策略分析结果 -->
                    <div id="strategyAnalysisContent" class="hidden">
                        <div class="card-title" style="margin: 20px 0 12px 0;"><i class="fas fa-chart-line"></i> 量化策略分析</div>
                        <div class="strategy-grid" id="strategyGrid"></div>
                        <div class="overall-recommendation" id="overallRecommendation">
                            <div class="overall-title">综合建议</div>
                            <div class="overall-text" id="overallText">--</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- AI问答抽屉 -->
    <div class="ai-hint" id="aiHint">
        <i class="fas fa-robot"></i> AI问答助手已就绪
    </div>
    <button class="chat-toggle-btn" onclick="toggleChatDrawer()" id="chatToggleBtn" title="AI问答">
        <i class="fas fa-comment-dots"></i>
    </button>
    <div class="chat-drawer" id="chatDrawer">
        <div class="chat-drawer-header">
            <span class="chat-drawer-title"><i class="fas fa-comment-dots"></i> AI投资问答</span>
            <button class="chat-close-btn" onclick="toggleChatDrawer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg ai">
                <div class="chat-msg-content">你好！我是AI投资助手，关于基金和持仓股票的问题都可以问我。</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="输入问题..." onkeypress="if(event.key==='Enter')sendChatMessage()">
            <button class="chat-send-btn" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- 股票详情抽屉 -->
    <div class="stock-drawer-overlay" id="stockOverlay" onclick="closeStockDrawer()"></div>
    <div class="stock-drawer" id="stockDrawer">
        <div class="stock-drawer-header">
            <span class="stock-drawer-title" id="stockDrawerTitle">股票详情</span>
            <button class="chat-close-btn" onclick="closeStockDrawer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="stock-drawer-content" id="stockDrawerContent">
            <!-- 动态加载内容 -->
        </div>
    </div>

    <script>
        // ===== 全局变量 =====
        let chart = null;
        let savedFunds = [];
        let currentFundCode = '';
        let currentBuyPrice = 0;
        let currentShares = 0;
        let currentFundInfo = {};
        let currentHoldings = [];
        let chartPeriod = 90;
        let chartShowFund = true;
        let chartShowBenchmark = false;
        let chartShowCost = false;
        let requestSeq = 0;  // 请求序号，用于防止异步竞态

        // ===== 主题切换 =====
        function toggleTheme() {
            const body = document.body;
            if (body.hasAttribute('data-theme')) {
                body.removeAttribute('data-theme'); // → 浅色模式
            } else {
                body.setAttribute('data-theme', 'dark'); // → 深色模式
            }
            localStorage.setItem('theme', body.hasAttribute('data-theme') ? 'dark' : 'light');
            // 重新渲染图表
            if (chart) {
                renderChart();
            }
        }

        // 初始化主题（默认浅色）
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }
        })();

        // ===== 基金分析 =====
        async function analyzeFund() {
            const fundCode = document.getElementById('fund_code').value.trim();
            const buyPrice = parseFloat(document.getElementById('buy_price').value);
            const shares = parseFloat(document.getElementById('shares').value);

            if (!fundCode || fundCode.length !== 6 || !/^\d{6}$/.test(fundCode)) {
                showError('请输入正确的6位基金代码');
                return;
            }

            if (!buyPrice || buyPrice <= 0) {
                showError('请输入有效的持仓成本');
                return;
            }

            if (!shares || shares <= 0) {
                showError('请输入有效的持有份额');
                return;
            }

            currentFundCode = fundCode;
            currentBuyPrice = buyPrice;
            currentShares = shares;
            requestSeq++;  // 递增请求序号，用于防止竞态
            const mySeq = requestSeq;

            // 显示加载状态
            hideError();
            showLoading(true);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fund_code: fundCode,
                        buy_price: buyPrice,
                        shares: shares
                    })
                });

                const result = await response.json();
                // 检查是否是最新的请求
                if (mySeq !== requestSeq) {
                    console.log('忽略过期的分析结果(seq:', mySeq, '!=', requestSeq, ')');
                    return;
                }
                showLoading(false);

                if (result.success) {
                    displayResults(result.data);
                } else {
                    showError(result.error || '分析失败，请重试');
                }
            } catch (error) {
                showLoading(false);
                showError('无法连接服务器，请确保已启动 Flask 服务（运行 start.bat 或 python app.py）');
            }
        }

        function showLoading(show) {
            document.getElementById('loadingCard').classList.toggle('hidden', !show);
            document.getElementById('fundInfoCard').classList.toggle('hidden', show);
            document.getElementById('chartCard').classList.toggle('hidden', show);
            document.getElementById('metricsCard').classList.toggle('hidden', show);
            document.getElementById('holdingsCard').classList.toggle('hidden', show);
            document.getElementById('aiAnalysisCard').classList.toggle('hidden', show);
            document.getElementById('profitCard').classList.toggle('hidden', show);
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function refreshFund() {
            if (currentFundCode) {
                document.getElementById('fund_code').value = currentFundCode;
                document.getElementById('buy_price').value = currentBuyPrice;
                document.getElementById('shares').value = currentShares;
                analyzeFund();
            }
        }

        // ===== 显示结果 =====
        function displayResults(data) {
            const fundInfo = data.fund_info;
            const profitLoss = data.profit_loss;
            const currentSeq = requestSeq;  // 捕获当前请求序号

            // 保存基金信息
            currentFundInfo = {
                name: fundInfo.fund_name,
                code: fundInfo.fund_code,
                nav: fundInfo.net_value,
                daily_change: fundInfo.day_growth,
                current_profit_loss: profitLoss ? profitLoss.total_profit_percent : 0,
                month_1_change: fundInfo.month_1_change,
                month_3_change: fundInfo.month_3_change,
                month_6_change: fundInfo.month_6_change,
                year_1_change: fundInfo.year_1_change,
                fund_type: fundInfo.fund_type || '混合型',
                scale: fundInfo.scale || '未知',
                manager: fundInfo.manager || '未知'
            };
            currentHoldings = data.holdings || [];

            // 显示基金信息
            displayFundInfo(fundInfo);
            document.getElementById('fundInfoCard').classList.remove('hidden');

            // 显示盈亏
            if (profitLoss) {
                displayProfitLoss(profitLoss);
                document.getElementById('profitCard').classList.remove('hidden');
            } else {
                document.getElementById('profitCard').classList.add('hidden');
            }

            // 显示持仓（displayHoldings 自己控制显隐）
            displayHoldings(data.holdings || []);

            // 显示历史走势
            if (data.history && data.history.length > 0) {
                displayChart(data.history, currentSeq);
                document.getElementById('chartCard').classList.remove('hidden');
            } else {
                document.getElementById('chartCard').classList.add('hidden');
            }

            // 加载风险指标（传递请求序号防止竞态）
            loadRiskMetrics(currentSeq);
            document.getElementById('metricsCard').classList.remove('hidden');

            // AI分析区（清空旧数据）
            document.getElementById('aiAnalysisCard').classList.remove('hidden');
            document.getElementById('aiAnalysisContent').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-brain"></i>
                    <p>点击上方按钮获取AI智能投资建议</p>
                </div>
            `;
            document.getElementById('aiAnalyzeBtn').innerHTML = '<i class="fas fa-brain"></i> 开始分析';
            
            // 清空策略分析区域
            document.getElementById('strategyAnalysisContent').classList.add('hidden');
            document.getElementById('strategyGrid').innerHTML = '';
        }

        // ===== 基金信息显示 =====
        function displayFundInfo(fundInfo) {
            const nav = fundInfo.net_value != null ? fundInfo.net_value : 0;
            const growth = fundInfo.day_growth != null ? fundInfo.day_growth : 0;
            const isPositive = growth >= 0;
            const changeClass = isPositive ? 'positive' : 'negative';
            const changeSign = isPositive ? '+' : '';
            const navDate = fundInfo.nav_date || '未知';
            let navTypeText = '官方净值';
            if (fundInfo.has_realtime) {
                if (fundInfo.realtime_source === 'holdings_calculated') {
                    navTypeText = '持仓估算';
                } else if (fundInfo.realtime_source === 'fundgz_api') {
                    navTypeText = '实时估算';
                } else {
                    navTypeText = '实时估算';
                }
            }

            document.getElementById('fundInfoContent').innerHTML = `
                <div class="fund-basic">
                    <div class="fund-name">${fundInfo.fund_name || '未知'}</div>
                    <div class="fund-code">${fundInfo.fund_code || '未知'}</div>
                    <div class="fund-meta">
                        <span class="meta-tag">${fundInfo.fund_type || '未知'}</span>
                        <span class="meta-tag">经理: ${fundInfo.manager || '未知'}</span>
                        <span class="meta-tag">规模: ${fundInfo.scale || '未知'}</span>
                    </div>
                </div>
                <div class="fund-value-section">
                    <div class="current-nav">${nav.toFixed(4)}</div>
                    <div class="nav-change ${changeClass}">${changeSign}${growth.toFixed(2)}%</div>
                    <div class="nav-type">${navTypeText} · ${navDate}</div>
                </div>
            `;
        }

        // ===== 盈亏概览显示 =====
        function displayProfitLoss(profitLoss) {
            const isProfit = profitLoss.total_profit >= 0;
            const profitClass = isProfit ? 'profit' : 'loss';
            const totalSign = isProfit ? '+' : '';
            const daySign = profitLoss.day_profit >= 0 ? '+' : '';

            document.getElementById('profitGrid').innerHTML = `
                <div class="profit-item ${profitClass}">
                    <div class="profit-label">总盈亏</div>
                    <div class="profit-value">${totalSign}${profitLoss.total_profit.toFixed(2)}</div>
                    <div class="profit-percent">${totalSign}${profitLoss.total_profit_percent.toFixed(2)}%</div>
                </div>
                <div class="profit-item neutral">
                    <div class="profit-label">当前价值</div>
                    <div class="profit-value">${profitLoss.current_value.toFixed(2)}</div>
                    <div class="profit-percent">市值（元）</div>
                </div>
                <div class="profit-item neutral">
                    <div class="profit-label">持仓成本</div>
                    <div class="profit-value">${profitLoss.cost_value.toFixed(2)}</div>
                    <div class="profit-percent">本金（元）</div>
                </div>
                <div class="profit-item ${profitLoss.day_profit >= 0 ? 'profit' : 'loss'}">
                    <div class="profit-label">当日盈亏</div>
                    <div class="profit-value">${daySign}${profitLoss.day_profit.toFixed(2)}</div>
                    <div class="profit-percent">${daySign}${profitLoss.day_profit_percent.toFixed(2)}%</div>
                </div>
            `;

            // 盈亏条
            const percent = profitLoss.total_profit_percent;
            let barWidth = Math.min(Math.abs(percent) * 2, 100);
            const fill = document.getElementById('profitBarFill');
            const marker = document.getElementById('profitBarMarker');

            if (percent >= 0) {
                fill.style.width = barWidth + '%';
                fill.className = 'profit-bar-fill profit';
                fill.style.marginLeft = '50%';
                marker.style.left = Math.min(50 + barWidth, 100) + '%';
            } else {
                fill.style.width = barWidth + '%';
                fill.className = 'profit-bar-fill loss';
                fill.style.marginLeft = (50 - barWidth) + '%';
                marker.style.left = Math.max(50 - barWidth, 0) + '%';
            }
        }

        // ===== 持仓显示 =====
        function displayHoldings(holdings) {
            const tbody = document.getElementById('holdingsBody');
            const card = document.getElementById('holdingsCard');
            
            if (!holdings || holdings.length === 0) {
                tbody.innerHTML = '';  // 清空旧数据
                // 显示卡片，但显示提示信息
                card.classList.remove('hidden');
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: var(--text-secondary);">暂不支持该基金的持仓查询，或该基金未公布最新持仓数据</td></tr>';
                return;
            }

            document.getElementById('holdingsCard').classList.remove('hidden');

            tbody.innerHTML = holdings.map(h => {
                const priceHtml = h.price !== null && h.price !== undefined
                    ? `<span class="price-tag">${h.price.toFixed(2)}</span>`
                    : '--';

                let changeClass = 'neutral';
                let changeSign = '';
                let changeHtml = '<span class="change-tag neutral">--</span>';

                if (h.change_pct !== null && h.change_pct !== undefined) {
                    changeClass = h.change_pct > 0 ? 'positive' : (h.change_pct < 0 ? 'negative' : 'neutral');
                    changeSign = h.change_pct > 0 ? '+' : '';
                    changeHtml = `<span class="change-tag ${changeClass}">${changeSign}${h.change_pct.toFixed(2)}%</span>`;
                }

                return `
                    <tr>
                        <td>${h.seq}</td>
                        <td><a class="stock-link" onclick="openStockDrawer('${h.code}', '${h.name}')">${h.code}</a></td>
                        <td><a class="stock-link" onclick="openStockDrawer('${h.code}', '${h.name}')">${h.name}</a></td>
                        <td>${priceHtml}</td>
                        <td>${changeHtml}</td>
                        <td><span class="ratio-tag">${h.ratio}</span></td>
                    </tr>
                `;
            }).join('');
        }

        // ===== 图表显示 =====
        function displayChart(history, mySeq) {
            // 保存历史数据
            window.chartHistory = history;

            // 加载基准数据（传递请求序号防止竞态）
            loadBenchmarkData(mySeq);

            // 渲染图表
            renderChart();
        }

        async function loadBenchmarkData(mySeq) {
            try {
                const resp = await fetch(`/api/fund/${currentFundCode}/benchmark`);
                const result = await resp.json();
                if (mySeq !== undefined && mySeq !== requestSeq) return;  // 过期请求，忽略
                if (result.success && result.data) {
                    window.chartBenchmark = result.data.benchmark;
                }
            } catch (e) {
                console.log('基准数据加载失败', e);
            }
        }

        function renderChart() {
            const container = document.getElementById('chartContainer');
            if (!container) return;

            const history = window.chartHistory || [];
            if (history.length === 0) return;

            if (!chart) {
                chart = echarts.init(container);
            }

            const datasets = [];
            const labels = history.map(h => h.date);

            // 单位净值线
            if (chartShowFund) {
                datasets.push({
                    name: '单位净值',
                    type: 'line',

                            <span class="mf-env-tag">市场环境: ${env.regime||'--'}</span>
                            <span class="mf-advice-tag ${actClass}">${rec.action||'--'}</span>
                            ${d.elapsed_seconds ? `<span style="font-size:11px;color:var(--text-muted)">耗时${d.elapsed_seconds}s</span>` : ''}
                        </div>
                        <div style="font-size:14px;color:var(--text-primary);line-height:1.6;margin-bottom:4px;">
                            综合评分 <b style="color:${color}">${score}分</b> · ${grade}
                        </div>

                            ${rec.key_reason||''}

                <div class="ai-section">

                </div>

                ${d.ai_detail ? `

                ${rec.watch_points?.length ? `

                        <div class="industry-stock-item" onclick="openStockDrawer('${s.code}', '${s.name}')">
                            <div style="font-weight: 600;">${s.name}</div>
                            <div style="font-size: 0.8em; color: var(--text-muted);">${s.code}</div>
                            <div style="margin-top: 6px;">
                                <span style="font-weight: 600;">${s.price > 0 ? s.price.toFixed(2) : '--'}</span>
                                <span class="change-tag ${cls}" style="margin-left: 6px;">${changePct !== 0 ? `${sign}${changePct.toFixed(2)}%` : '--'}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div class="empty-state"><div class="stars"><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span></div><i class="fas fa-trophy"></i><p>暂无数据</p></div>';
            }

            html += '</div></div>';
            document.getElementById('stockDrawerContent').innerHTML = html;

            // 加载K线图
            loadStockKline(data.code);
        }

        async function loadStockKline(code) {
            try {
                const resp = await fetch(`/api/stock/${code}/kline?period=daily&limit=60`);
                const result = await resp.json();

                if (result.success && result.data && result.data.length > 0) {
                    renderStockKline(result.data);
                }
            } catch (e) {
                console.log('K线加载失败', e);
            }
        }

        function renderStockKline(data) {
            const container = document.getElementById('stockKline');
            if (!container) return;

            const klineChart = echarts.init(container);

            const dates = data.map(item => item.date);
            const ohlc = data.map(item => [item.open, item.close, item.low, item.high]);
            const volumes = data.map(item => item.volume);

            const isDark = document.body.hasAttribute('data-theme');
            const axisColor = isDark ? '#2d3a4a' : '#e3e8ee';
            const axisLabel = isDark ? '#64748b' : '#8899aa';
            const splitColor = isDark ? '#1e2d3d' : '#eef1f5';

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: isDark ? 'rgba(30, 41, 59, 0.95)' : 'rgba(13, 37, 61, 0.95)',
                    borderColor: axisColor,
                    textStyle: { color: '#ffffff', fontFamily: "'Inter', sans-serif", fontWeight: 300 }
                },
                grid: [
                    { left: '10%', right: '8%', top: '10%', height: '55%' },
                    { left: '10%', right: '8%', top: '72%', height: '15%' }
                ],
                xAxis: [
                    { type: 'category', data: dates, gridIndex: 0, axisLabel: { show: false }, splitLine: { show: false } },
                    { type: 'category', data: dates, gridIndex: 1, axisLabel: { color: axisLabel }, splitLine: { show: false } }
                ],
                yAxis: [
                    { scale: true, gridIndex: 0, axisLabel: { color: axisLabel }, splitLine: { color: splitColor } },
                    { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { color: axisLabel } }
                ],
                dataZoom: [
                    { type: 'inside', xAxisIndex: [0, 1], start: 70, end: 100 },
                    { type: 'slider', xAxisIndex: [0, 1], start: 70, end: 100, height: 15, bottom: 5, borderColor: axisColor, backgroundColor: isDark ? 'rgba(255,255,255,0.04)' : 'rgba(13,37,61,0.04)' }
                ],
                series: [
                    {
                        type: 'candlestick',
                        data: ohlc,
                        xAxisIndex: 0,
                        yAxisIndex: 0,
                        itemStyle: {
                            color: '#ea2261',
                            color0: '#10b981',
                            borderColor: '#ea2261',
                            borderColor0: '#10b981'
                        }
                    },
                    {
                        type: 'bar',
                        data: volumes,
                        xAxisIndex: 1,
                        yAxisIndex: 1,
                        itemStyle: { color: isDark ? 'rgba(102, 94, 253, 0.2)' : 'rgba(83, 58, 253, 0.2)' }
                    }
                ]
            };

            klineChart.setOption(option, true);
        }

        // ===== 保存基金 =====
        function saveCurrentFund() {
            const fundCode = document.getElementById('fund_code').value.trim();
            const buyPrice = parseFloat(document.getElementById('buy_price').value);
            const shares = parseFloat(document.getElementById('shares').value);

            if (!fundCode || !buyPrice || !shares) return;

            const existingIndex = savedFunds.findIndex(f => f.fund_code === fundCode);
            // 仅在 currentFundInfo 与输入代码一致时复用名称，否则用代码
            const fundName = (currentFundInfo.code === fundCode && currentFundInfo.name)
                ? currentFundInfo.name
                : `基金 ${fundCode}`;
            const fundData = { 
                fund_code: fundCode, 
                fund_name: fundName,
                buy_price: buyPrice, 
                shares: shares 
            };

            if (existingIndex >= 0) {
                savedFunds[existingIndex] = fundData;
            } else {
                savedFunds.push(fundData);
            }

            localStorage.setItem('savedFunds', JSON.stringify(savedFunds));
            displaySavedFunds();
            refreshDailyReturn();  // 刷新今日收益
            // 如果用的是兜底名称，后台拉取真实名称
            if (fundName.startsWith('基金 ')) {
                fetchAndUpdateName(fundCode, fundData);
            }
            alert('基金已保存！');
        }

        // 异步补全基金名称
        async function fetchAndUpdateName(fundCode, fundData) {
            try {
                const resp = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fund_code: fundCode, buy_price: fundData.buy_price, shares: fundData.shares })
                });
                const result = await resp.json();
                if (result.success) {
                    const realName = result.data.fund_info.fund_name;
                    if (realName && realName !== fundData.fund_name) {
                        const idx = savedFunds.findIndex(f => f.fund_code === fundCode);
                        if (idx >= 0) {
                            savedFunds[idx].fund_name = realName;
                            localStorage.setItem('savedFunds', JSON.stringify(savedFunds));
                            displaySavedFunds();
                        }
                    }
                }
            } catch (e) {
                console.log('异步补名失败', e);
            }
        }

        function displaySavedFunds() {
            const container = document.getElementById('savedFundsList');
            const card = document.getElementById('savedFundsCard');

            if (savedFunds.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="stars">
                            <span class="star">✦</span>
                            <span class="star">✧</span>
                            <span class="star">✦</span>
                            <span class="star">✧</span>
                            <span class="star">✦</span>
                            <span class="star">✧</span>
                        </div>
                        <i class="fas fa-inbox"></i>
                        <p>暂无保存的基金</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = savedFunds.map((f, i) => {
                // 清理旧数据中可能残留的后缀
                let cleanName = f.fund_name || '未知基金';
                const suffixes = ['基金历史净值 基金档案', '基金历史净值', '基金档案', '天天基金网'];
                for (const s of suffixes) {
                    if (cleanName.includes(s)) {
                        cleanName = cleanName.replace(s, '').trim();
                        break;
                    }
                }
                // 兜底名称 → 后台补全
                if (cleanName.startsWith('基金 ') && /^基金 \d{6}$/.test(cleanName)) {
                    fetchAndUpdateName(f.fund_code, f);
                }
                return `
                <div class="saved-fund-item" onclick="loadSavedFund(${i})">
                    <div class="saved-fund-info">
                        <div class="saved-fund-name">${cleanName}</div>
                        <div class="saved-fund-code">${f.fund_code} | 成本: ${f.buy_price} | 份额: ${f.shares}</div>
                    </div>
                    <div class="saved-fund-actions">
                        <button class="saved-fund-btn" onclick="event.stopPropagation(); refreshSavedFund(${i})">刷新</button>
                        <button class="saved-fund-btn delete" onclick="event.stopPropagation(); deleteSavedFund(${i})">删除</button>
                    </div>
                </div>`;
            }).join('');
        }

        function loadSavedFund(index) {
            const fund = savedFunds[index];
            document.getElementById('fund_code').value = fund.fund_code;
            document.getElementById('buy_price').value = fund.buy_price;
            document.getElementById('shares').value = fund.shares;
            // 自动加载该基金的分析数据
            analyzeFund();
        }

        function refreshSavedFund(index) {
            loadSavedFund(index);
            analyzeFund();
        }

        function deleteSavedFund(index) {
            savedFunds.splice(index, 1);
            localStorage.setItem('savedFunds', JSON.stringify(savedFunds));
            displaySavedFunds();
            refreshDailyReturn();  // 刷新今日收益
        }

        // ===== 初始化 =====
        window.onload = function() {
            // 检测服务器连接状态
            checkServerConnection();
            
            // 加载已保存基金
            const saved = localStorage.getItem('savedFunds');
            if (saved) {
                savedFunds = JSON.parse(saved);
                displaySavedFunds();
                refreshDailyReturn();  // 自动计算今日收益
            }

            // 图表响应式
            window.addEventListener('resize', () => {
                if (chart) chart.resize();
            });
        };

        // ===== 今日收益概览 =====
        async function refreshDailyReturn() {
            const card = document.getElementById('dailyReturnCard');
            const valEl = document.getElementById('dailyReturnValue');
            const detailEl = document.getElementById('dailyReturnDetail');

            if (savedFunds.length === 0) {
                card.classList.add('hidden');
                return;
            }

            card.classList.remove('hidden');
            valEl.innerHTML = '<span style="color:var(--text-muted);font-size:13px;font-weight:300;">计算中...</span>';
            detailEl.textContent = '';

            let totalDayProfit = 0;
            let totalCurrentValue = 0;
            let successCount = 0;
            const details = [];

            // 并发请求所有已保存基金
            const promises = savedFunds.map(async (f) => {
                try {
                    const resp = await fetch('/api/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fund_code: f.fund_code,
                            buy_price: f.buy_price,
                            shares: f.shares
                        })
                    });
                    const result = await resp.json();
                    if (result.success) {
                        const pl = result.data.profit_loss;
                        const fi = result.data.fund_info;
                        totalDayProfit += pl.day_profit || 0;
                        totalCurrentValue += pl.current_value || 0;
                        successCount++;
                        details.push({
                            name: fi.fund_name || f.fund_code,
                            profit: pl.day_profit || 0,
                            profitPct: pl.day_profit_percent || 0
                        });
                    }
                } catch (e) {
                    console.log(`获取 ${f.fund_code} 失败`, e);
                }
            });

            await Promise.all(promises);

            if (successCount === 0) {
                valEl.innerHTML = '<span style="color:var(--text-muted);font-size:13px;">无法获取数据</span>';
                return;
            }

            const sign = totalDayProfit >= 0 ? '+' : '';
            const color = totalDayProfit >= 0 ? 'var(--accent-red)' : 'var(--accent-green)';
            valEl.innerHTML = `<span style="color:${color};font-weight:400;">${sign}${totalDayProfit.toFixed(2)}</span>
                <span style="font-size:12px;color:var(--text-muted);font-weight:300;margin-left:6px;">元</span>`;

            const dayReturnPct = totalCurrentValue > 0 ? (totalDayProfit / (totalCurrentValue - totalDayProfit) * 100) : 0;
            const pctSign = dayReturnPct >= 0 ? '+' : '';
            detailEl.innerHTML = `
                <span style="color:${color}">${pctSign}${dayReturnPct.toFixed(2)}%</span>
                &nbsp;·&nbsp;持仓市值 ${totalCurrentValue.toFixed(2)} 元
                &nbsp;·&nbsp;${successCount}/${savedFunds.length} 只
            `;
        }

        // 检测服务器连接
        async function checkServerConnection() {
            try {
                const response = await fetch('/api/fund/000001/info');
                if (response.ok) {
                    console.log('服务器连接正常');
                }
            } catch (error) {
                // 服务器未启动，显示提示
                const navActions = document.querySelector('.nav-actions');
                if (navActions) {
                    navActions.innerHTML += '<span style="color: var(--accent-red); font-size: 0.8em; margin-right: 10px;">⚠ 服务器未连接</span>';
                }
                showError('⚠ 服务器未启动，请先运行 start.bat 或 python app.py');
            }
        }

        // 回车键快捷搜索
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.target.tagName !== 'INPUT') {
                analyzeFund();
            }
        });
    </script>
