<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI多因子透视诊断</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0f172a; color: #e2e8f0; }
.container { max-width: 1280px; margin: 0 auto; padding: 24px; }

/* Header */
.header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 28px 32px; border-radius: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(59,130,246,0.2); box-shadow: 0 0 30px rgba(59,130,246,0.08); }
.header h1 { font-size: 22px; font-weight: 700; color: #f8fafc; }
.header .fund-name { font-size: 14px; color: #94a3b8; margin-top: 4px; }
.header .env-badge { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); padding: 8px 18px; border-radius: 20px; font-size: 13px; color: #60a5fa; }

/* Input */
.input-section { background: #1e293b; padding: 24px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #334155; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.input-section input { flex: 1; min-width: 200px; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #f8fafc; font-size: 15px; outline: none; transition: border 0.2s; }
.input-section input:focus { border-color: #3b82f6; }
.input-section button { padding: 12px 28px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.input-section button:hover { background: linear-gradient(135deg, #60a5fa, #3b82f6); transform: translateY(-1px); }
.input-section button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Loading */
.loading { text-align: center; padding: 80px 0; }
.loading .spinner { width: 50px; height: 50px; border: 4px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading .progress-text { color: #94a3b8; font-size: 14px; }
.loading .progress-bar { width: 300px; height: 4px; background: #334155; border-radius: 2px; margin: 12px auto; overflow: hidden; }
.loading .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 2px; transition: width 0.5s ease; }

/* Grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; animation: fadeInUp 0.5s ease both; }
.card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.card.full { grid-column: 1 / -1; }

@keyframes fadeInUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.card:nth-child(2) { animation-delay: 0.08s; }
.card:nth-child(3) { animation-delay: 0.16s; }
.card:nth-child(4) { animation-delay: 0.24s; }

/* Score Circle */
.score-section { display: flex; align-items: center; gap: 32px; }
.score-circle { position: relative; width: 170px; height: 170px; flex-shrink: 0; }
.score-circle svg { transform: rotate(-90deg); }
.score-circle .bg { fill: none; stroke: #334155; stroke-width: 12; }
.score-circle .fg { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1.2s ease; }
.score-circle .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
.score-circle .score-num { font-size: 46px; font-weight: 800; line-height: 1; }
.score-circle .score-grade { font-size: 14px; margin-top: 4px; font-weight: 600; }
.score-info { flex: 1; }
.score-info .advice { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
.score-info .reason { font-size: 13px; color: #94a3b8; line-height: 1.7; }

/* Dimension Bars */
.dim-item { display: flex; align-items: center; margin-bottom: 14px; gap: 12px; }
.dim-label { width: 90px; font-size: 13px; font-weight: 500; color: #cbd5e1; }
.dim-bar-bg { flex: 1; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; }
.dim-bar-fg { height: 100%; border-radius: 5px; transition: width 0.8s ease; }
.dim-score { width: 50px; text-align: right; font-size: 15px; font-weight: 700; }
.dim-weight { width: 45px; text-align: right; font-size: 11px; color: #64748b; }

/* Radar */
.radar-wrap { height: 300px; position: relative; }
.radar-wrap canvas { max-height: 300px; }

/* Model Detail Cards */
.model-card { background: #0f172a; border-radius: 10px; padding: 18px; margin-bottom: 14px; border-left: 3px solid; }
.model-card .model-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.model-card .model-name { font-size: 14px; font-weight: 600; color: #f8fafc; }
.model-card .model-score { font-size: 24px; font-weight: 800; }
.model-card .sub-scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.model-card .sub-item { text-align: center; padding: 8px; background: #1e293b; border-radius: 6px; }
.model-card .sub-label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
.model-card .sub-val { font-size: 16px; font-weight: 700; }

/* Holdings Table */
.holdings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.holdings-table th { background: #0f172a; padding: 10px 12px; text-align: left; font-weight: 600; color: #94a3b8; border-bottom: 2px solid #334155; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.holdings-table td { padding: 10px 12px; border-bottom: 1px solid #1e293b; }
.holdings-table tr:hover td { background: #1e293b; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.tag-green { background: rgba(16,185,129,0.15); color: #34d399; }
.tag-yellow { background: rgba(245,158,11,0.15); color: #fbbf24; }
.tag-orange { background: rgba(249,115,22,0.15); color: #fb923c; }
.tag-red { background: rgba(239,68,68,0.15); color: #f87171; }

/* Risk List */
.risk-list { list-style: none; }
.risk-list li { padding: 10px 0; font-size: 13px; color: #cbd5e1; border-bottom: 1px solid #1e293b; display: flex; align-items: flex-start; gap: 10px; line-height: 1.6; }
.risk-list li::before { content: ''; flex-shrink: 0; width: 6px; height: 6px; background: #f59e0b; border-radius: 50%; margin-top: 7px; }

/* AI Summary */
.ai-summary { background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.08)); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; padding: 24px; }
.ai-summary h3 { color: #60a5fa; margin-bottom: 12px; }
.ai-summary .summary-text { font-size: 14px; line-height: 1.8; color: #e2e8f0; }
.ai-summary .detail-text { font-size: 13px; line-height: 1.8; color: #cbd5e1; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(59,130,246,0.15); }

/* Recommendation */
.rec-card { display: flex; align-items: center; gap: 20px; padding: 20px; background: #0f172a; border-radius: 10px; margin-top: 16px; }
.rec-action { font-size: 28px; font-weight: 800; min-width: 80px; text-align: center; }
.rec-detail { flex: 1; }
.rec-detail .rec-reason { font-size: 15px; font-weight: 600; color: #f8fafc; margin-bottom: 6px; }
.rec-detail .rec-points { font-size: 12px; color: #94a3b8; }

/* Responsive */
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .score-section { flex-direction: column; text-align: center; } .input-section { flex-direction: column; } }

/* Error */
.error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 24px; text-align: center; color: #f87171; margin: 40px 0; }
.error-box h3 { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">

  <!-- Input -->
  <div class="input-section">
    <input type="text" id="fundCode" placeholder="输入基金代码（如 000001）" maxlength="6">
    <button id="analyzeBtn" onclick="startDiagnosis()">开始诊断</button>
  </div>

  <!-- Loading -->
  <div id="loadingSection" style="display:none;">
    <div class="loading">
      <div class="spinner"></div>
      <div class="progress-text" id="progressText">正在获取基金数据...</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Error -->
  <div id="errorSection" style="display:none;" class="error-box">
    <h3 id="errorTitle">诊断失败</h3>
    <p id="errorMsg"></p>
  </div>

  <!-- Result -->
  <div id="resultSection" style="display:none;">

    <!-- Header -->
    <div class="header">
      <div>
        <h1>AI多因子透视诊断</h1>
        <div class="fund-name" id="headerFundName">-- · 分析日期: --</div>
      </div>
      <div class="env-badge" id="headerEnvBadge">市场环境：--</div>
    </div>

    <!-- Row 1: Score + Dimensions -->
    <div class="grid">
      <div class="card">
        <h3>综合评分</h3>
        <div class="score-section">
          <div class="score-circle" id="scoreCircle"></div>
          <div class="score-info">
            <div class="advice" id="adviceText">--</div>
            <div class="reason" id="reasonText">--</div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>五维度评分</h3>
        <div id="dimBars"></div>
      </div>
    </div>

    <!-- Row 2: Radar + AI Summary -->
    <div class="grid">
      <div class="card">
        <h3>五维雷达图</h3>
        <div class="radar-wrap"><canvas id="radarChart"></canvas></div>
      </div>
      <div class="card">
        <h3>AI 综合诊断</h3>
        <div class="ai-summary" id="aiSummarySection">
          <div class="summary-text" id="aiSummaryText">--</div>
          <div class="detail-text" id="aiDetailText">--</div>
        </div>
        <div class="rec-card" id="recCard">
          <div class="rec-action" id="recAction">--</div>
          <div class="rec-detail">
            <div class="rec-reason" id="recReason">--</div>
            <div class="rec-points" id="recPoints">--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Row 3: 5 Model Details -->
    <div class="card full">
      <h3>五模型详情</h3>
      <div id="modelDetails"></div>
    </div>

    <!-- Row 4: Holdings -->
    <div class="card full">
      <h3>核心持仓诊断</h3>
      <table class="holdings-table" id="holdingsTable"></table>
    </div>

    <!-- Row 5: Risk Points -->
    <div class="card full">
      <h3>需关注的风险点</h3>
      <ul class="risk-list" id="riskList"></ul>
    </div>

  </div>
</div>

<script>
let radarChartInstance = null;

// ── Color helpers ──
function scoreColor(s) {
  if (s >= 80) return '#10b981';
  if (s >= 70) return '#34d399';
  if (s >= 55) return '#f59e0b';
  if (s >= 40) return '#f97316';
  return '#ef4444';
}
function scoreGrade(s) {
  if (s >= 80) return '优秀';
  if (s >= 70) return '良好';
  if (s >= 55) return '一般';
  if (s >= 40) return '较低';
  return '差';
}
function adviceText(s) {
  if (s >= 80) return '适合作为核心配置';
  if (s >= 70) return '可持有，关注风险点';
  if (s >= 55) return '观望，等待更好时机';
  if (s >= 40) return '建议减仓或寻找替代品';
  return '强烈建议回避';
}

// ── Progress simulation ──
let progressTimer = null;
function startProgress() {
  const steps = [
    [12, '正在获取基金信息...'],
    [22, '正在分析市场环境...'],
    [32, '正在获取重仓股数据(并发)...'],
    [48, '正在计算个股质量评分...'],
    [58, '正在计算估值性价比...'],
    [66, '正在计算舆情与动量...'],
    [74, '正在计算行业景气度...'],
    [80, '正在计算经理行为评分...'],
    [88, '正在AI综合解读(等待API)...'],
    [96, '正在组装最终报告...'],
  ];
  let i = 0;
  progressTimer = setInterval(() => {
    if (i < steps.length) {
      document.getElementById('progressFill').style.width = steps[i][0] + '%';
      document.getElementById('progressText').textContent = steps[i][1];
      i++;
    }
  }, 3000);
}
function stopProgress() {
  if (progressTimer) clearInterval(progressTimer);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '诊断完成！';
}

// ── Start diagnosis ──
async function startDiagnosis() {
  const code = document.getElementById('fundCode').value.trim();
  if (!code || code.length !== 6 || !/^\d+$/.test(code)) {
    alert('请输入6位基金代码');
    return;
  }
  const apiKey = localStorage.getItem('deepseek_api_key') || '';
  document.getElementById('errorSection').style.display = 'none';
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('loadingSection').style.display = 'block';
  document.getElementById('analyzeBtn').disabled = true;
  startProgress();

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 120000); // 2分钟超时
    const resp = await fetch('/api/multifactor-diagnosis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fund_code: code, api_key: apiKey }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    const data = await resp.json();
    stopProgress();

    if (!data.success) {
      document.getElementById('loadingSection').style.display = 'none';
      document.getElementById('errorSection').style.display = 'block';
      document.getElementById('errorMsg').textContent = data.error || '未知错误';
      document.getElementById('analyzeBtn').disabled = false;
      return;
    }

    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';
    renderResult(data);
  } catch (err) {
    stopProgress();
    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('errorSection').style.display = 'block';
    document.getElementById('errorMsg').textContent = err.message;
  }
  document.getElementById('analyzeBtn').disabled = false;
}

// ── Render result ──
function renderResult(d) {
  // Header
  const elapsed = d.elapsed_seconds ? ` · 耗时${d.elapsed_seconds}秒` : '';
  document.getElementById('headerFundName').textContent = `${d.fund_name} (${d.fund_code}) · 分析日期: ${d.analysis_date}${elapsed}`;
  document.getElementById('headerEnvBadge').textContent = `市场环境：${d.market_environment.regime}`;

  // Score circle
  const score = d.composite_score;
  const r = 70, circ = 2 * Math.PI * r;
  const color = scoreColor(score);
  const offset = circ * (1 - score / 100);
  document.getElementById('scoreCircle').innerHTML = `
    <svg viewBox="0 0 170 170" width="170" height="170">
      <circle class="bg" cx="85" cy="85" r="${r}"/>
      <circle class="fg" cx="85" cy="85" r="${r}" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="score-text">
      <div class="score-num" style="color:${color}">${score}</div>
      <div class="score-grade" style="color:${color}">${scoreGrade(score)}</div>
    </div>`;

  document.getElementById('adviceText').textContent = adviceText(score);
  document.getElementById('reasonText').textContent = d.action_advice || '';

  // Dimension bars
  const dims = [
    { name: '个股质量', scoreKey: 'M1_stock_quality', weightKey: 'M1', color: '#10b981' },
    { name: '估值性价比', scoreKey: 'M2_valuation', weightKey: 'M2', color: '#f59e0b' },
    { name: '新闻舆情', scoreKey: 'M3_sentiment', weightKey: 'M3', color: '#3b82f6' },
    { name: '行业景气', scoreKey: 'M4_industry', weightKey: 'M4', color: '#8b5cf6' },
    { name: '经理行为', scoreKey: 'M5_manager', weightKey: 'M5', color: '#06b6d4' },
  ];
  const weights = d.weights || {};
  let dimHtml = '';
  dims.forEach(dm => {
    const ms = d.model_scores[dm.scoreKey];
    const s = ms ? ms.score : 0;
    const w = weights[dm.weightKey] || 0;
    dimHtml += `
      <div class="dim-item">
        <div class="dim-label">${dm.name}</div>
        <div class="dim-bar-bg"><div class="dim-bar-fg" style="width:${s}%;background:${dm.color}"></div></div>
        <div class="dim-score" style="color:${dm.color}">${s}</div>
        <div class="dim-weight">${w}%</div>
      </div>`;
  });
  document.getElementById('dimBars').innerHTML = dimHtml;

  // Radar
  if (radarChartInstance) radarChartInstance.destroy();
  radarChartInstance = new Chart(document.getElementById('radarChart'), {
    type: 'radar',
    data: {
      labels: dims.map(d => d.name),
      datasets: [{
        label: '基金评分',
        data: dims.map(dm => (d.model_scores[dm.scoreKey] || {}).score || 0),
        backgroundColor: 'rgba(59,130,246,0.12)',
        borderColor: '#3b82f6',
        borderWidth: 2,
        pointBackgroundColor: '#3b82f6',
        pointRadius: 4,
      }, {
        label: '同类平均',
        data: [65, 55, 60, 58, 62],
        backgroundColor: 'rgba(0,0,0,0)',
        borderColor: '#475569',
        borderWidth: 1.5,
        borderDash: [4, 4],
        pointBackgroundColor: '#475569',
        pointRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: { r: { min: 0, max: 100, ticks: { stepSize: 20, font: { size: 10 }, color: '#64748b', backdropColor: 'transparent' }, pointLabels: { font: { size: 12 }, color: '#cbd5e1' }, grid: { color: '#334155' }, angleLines: { color: '#334155' } } },
      plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, color: '#94a3b8', usePointStyle: true, padding: 16 } } }
    }
  });

  // AI Summary
  document.getElementById('aiSummaryText').textContent = d.ai_summary || '--';
  document.getElementById('aiDetailText').textContent = d.ai_detail || '';
  const rec = d.recommendation || {};
  const recColor = scoreColor(score);
  document.getElementById('recAction').textContent = rec.action || '--';
  document.getElementById('recAction').style.color = recColor;
  document.getElementById('recReason').textContent = rec.key_reason || '';
  const wp = rec.watch_points || [];
  document.getElementById('recPoints').textContent = wp.join('；');

  // Model Details
  const modelDefs = [
    { key: 'M1_stock_quality', name: 'M1 个股质量加权评分', subs: ['profitability','growth','cashflow','safety'], subLabels: ['盈利能力','成长性','现金流','安全性'], color: '#10b981' },
    { key: 'M2_valuation', name: 'M2 估值性价比', subs: ['pe_percentile','pb_percentile','peg','dividend'], subLabels: ['PE分位数','PB分位数','PEG','股息率'], color: '#f59e0b' },
    { key: 'M3_sentiment', name: 'M3 新闻舆情与动量', subs: ['news_sentiment','analyst_rating','research_visit','capital_flow'], subLabels: ['新闻情感','分析师评级','调研热度','资金流向'], color: '#3b82f6' },
    { key: 'M4_industry', name: 'M4 行业前景与宏观匹配', subs: ['prosperity','policy','macro'], subLabels: ['行业景气','政策支持','宏观匹配'], color: '#8b5cf6' },
    { key: 'M5_manager', name: 'M5 基金经理行为一致性', subs: ['style_stability','timing_quality','consistency','performance'], subLabels: ['风格稳定','调仓质量','言行一致','业绩可持续'], color: '#06b6d4' },
  ];
  let mhtml = '';
  modelDefs.forEach(md => {
    const ms = d.model_scores[md.key] || {};
    const s = ms.score || 0;
    const sc = ms.sub_scores || {};
    mhtml += `<div class="model-card" style="border-left-color:${md.color}">
      <div class="model-header">
        <div class="model-name">${md.name}</div>
        <div class="model-score" style="color:${scoreColor(s)}">${s}</div>
      </div>
      <div class="sub-scores">`;
    md.subs.forEach((sk, i) => {
      const sv = sc[sk];
      mhtml += `<div class="sub-item">
        <div class="sub-label">${md.subLabels[i]}</div>
        <div class="sub-val" style="color:${sv !== undefined ? scoreColor(sv) : '#64748b'}">${sv !== undefined ? sv : '-'}</div>
      </div>`;
    });
    mhtml += `</div></div>`;
  });
  document.getElementById('modelDetails').innerHTML = mhtml;

  // Holdings Table
  const holdings = d.holdings_analysis || [];
  let thtml = '<thead><tr><th>代码</th><th>名称</th><th>权重</th><th>质量分</th><th>估值分</th><th>关键指标</th><th>诊断</th></tr></thead><tbody>';
  holdings.forEach(h => {
    const qc = scoreColor(h.quality);
    const vc = scoreColor(h.valuation);
    thtml += `<tr>
      <td>${h.code}</td><td><strong>${h.name}</strong></td><td>${(h.weight*100).toFixed(1)}%</td>
      <td style="color:${qc};font-weight:700">${h.quality}</td>
      <td style="color:${vc};font-weight:700">${h.valuation}</td>
      <td style="font-size:12px;color:#94a3b8">${h.key_metrics}</td>
      <td><span class="tag tag-${h.tag}">${h.verdict}</span></td>
    </tr>`;
  });
  thtml += '</tbody>';
  document.getElementById('holdingsTable').innerHTML = thtml;

  // Risk Points
  const risks = d.risk_points || [];
  document.getElementById('riskList').innerHTML = risks.map(r => `<li>${r}</li>`).join('');
}

// ── Enter key ──
document.getElementById('fundCode').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') startDiagnosis();
});
</script>
